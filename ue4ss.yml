---
# UE4SS (Unreal Engine 4/5 Scripting System) exposes a set of engine-level globals to
# every Lua mod. The game runs Lua 5.4, but selene's built-in stdlibs are lua51/lua52/lua53 only,
# so this checks against lua51 plus the 5.4 calls and the engine globals listed below.
base: lua51
globals:
  ExecuteInGameThread:
    any: true
  FName:
    any: true
  FText:
    any: true
  FindAllOf:
    any: true
  FindFirstOf:
    any: true
  FindObject:
    any: true
  ForEachUObject:
    any: true
  CancelDelayedAction:
    any: true
  EngineTickAvailable:
    any: true
  Key:
    any: true
  LoopInGameThreadAfterFrames:
    any: true
  LoopInGameThreadWithDelay:
    any: true
  ModifierKey:
    any: true
  RegisterHook:
    any: true
  RegisterKeyBind:
    any: true
  StaticConstructObject:
    any: true
  StaticFindObject:
    any: true
  LoadAsset:
    any: true
  CreateInvalidObject:
    any: true
  UE4SS:
    any: true
